design_system:
  typography:
    sans_serif_font: "Inter (weights 300, 400, 500, 600, 700, 800)"
    display_font: "Space Grotesk (weights 400, 500, 600, 700)"
  colors:
    light_mode:
      background: "hsl(0, 0%, 100%)" # Pure White
      foreground: "hsl(220, 25%, 10%)" # Slate Black / Charcoal
      primary: "hsl(170, 80%, 40%)" # Teal / Emerald
      primary_foreground: "hsl(0, 0%, 100%)" # White text on Teal
      secondary: "hsl(220, 15%, 96%)" # Very Light Gray / Cool Off-White
      secondary_foreground: "hsl(220, 25%, 10%)"
      accent: "hsl(210, 90%, 50%)" # Royal Blue
      accent_foreground: "hsl(0, 0%, 100%)"
      muted: "hsl(220, 15%, 96%)"
      muted_foreground: "hsl(220, 10%, 45%)"
      destructive: "hsl(0, 84%, 60%)" # Bright Red
      destructive_foreground: "hsl(0, 0%, 100%)"
      border: "hsl(220, 15%, 91%)"
      input: "hsl(220, 15%, 91%)"
      ring: "hsl(170, 80%, 40%)"
      card: "hsl(0, 0%, 100%)"
      card_foreground: "hsl(220, 25%, 10%)"
      sidebar:
        background: "hsl(0, 0%, 98%)"
        foreground: "hsl(240, 5.3%, 26.1%)"
        primary: "hsl(240, 5.9%, 10%)"
        accent: "hsl(240, 4.8%, 95.9%)"
        border: "hsl(220, 13%, 91%)"
    dark_mode:
      background: "hsl(220, 20%, 6%)" # Deep Dark Space Gray
      foreground: "hsl(220, 15%, 95%)" # Off-white
      primary: "hsl(170, 80%, 45%)" # Bright Teal
      primary_foreground: "hsl(0, 0%, 100%)"
      secondary: "hsl(220, 20%, 15%)" # Slate Gray
      secondary_foreground: "hsl(220, 15%, 95%)"
      accent: "hsl(210, 90%, 55%)" # Royal Light Blue
      accent_foreground: "hsl(0, 0%, 100%)"
      muted: "hsl(220, 20%, 15%)"
      muted_foreground: "hsl(220, 10%, 55%)"
      destructive: "hsl(0, 62.8%, 30.6%)" # Crimson / Burgundy Red
      destructive_foreground: "hsl(210, 40%, 98%)"
      border: "hsl(220, 20%, 15%)"
      input: "hsl(220, 20%, 15%)"
      ring: "hsl(170, 80%, 45%)"
      card: "hsl(220, 20%, 9%)"
      card_foreground: "hsl(220, 15%, 95%)"
      sidebar:
        background: "hsl(240, 5.9%, 10%)"
        foreground: "hsl(240, 4.8%, 95.9%)"
        primary: "hsl(224.3, 76.3%, 48%)"
        accent: "hsl(240, 3.7%, 15.9%)"
        border: "hsl(240, 3.7%, 15.9%)"
  design_utilities:
    text_gradient: "Linear gradient (135deg) from Primary Teal to Accent Blue"
    bg_gradient_primary: "Linear gradient (135deg) from Primary Teal to Accent Blue"
    bg_gradient_primary_hover: "Linear gradient (135deg) from darker Teal to darker Accent Blue"
    border_gradient: "Gradient border outline from Primary Teal to Accent Blue"
    shadow_glow: "Box shadow glow effect combining Primary Teal (opacity 0.3) and Accent Blue (opacity 0.2)"
    shadow_glow_sm: "Subtle box shadow glow effect using Teal (opacity 0.2)"
    glass_card: "Background opacity (3% light / 5% dark) with blur (16px) and border (8% light / 10% dark)"
    noise_texture: "Turbulence fractalNoise overlay texture at 3% opacity"
    animated_grid: "Gridlines using primary color at 8% opacity with animation grid-pulse"
    diagonal_stripes: "Repeating linear gradient at -45deg with primary color at 2% opacity"

animations:
  transitions:
    page_transition: "Framer Motion AnimatePresence 'wait' layout transition with smooth fade-in and scale effects"
  keyframes:
    accordion_down: "Expands height smoothly from 0 to full height"
    accordion_up: "Collapses height smoothly to 0"
    float: "Translates Y position up to -20px and back in 6s infinite loop"
    pulse_glow: "Pulsates shadow glow offset size up to 12px using primary color"
    code_float: "Y translation (up to -40px) and rotation (up to 5deg) with opacity shift (0.08 to 0.25) in 8s infinite loop"
    marquee: "Horizontal translation from X: 0 to X: -50% for infinite sliding carousel"
    shimmer: "Moving light reflection effect across background in 3s infinite loop"
    gradient_shift: "Moves the gradient position (0% to 100%) in 4s infinite loop"
    ripple: "Scales element up 2x and fades opacity to 0 in 2s loop"

page_structure:
  layout_wrapper: "Layout.tsx wraps all page elements globally to provide structure"
  components:
    - name: "TopBar"
      purpose: "Sticky sub-header showing contact email, phone number, and social icons (Instagram, Facebook, LinkedIn)"
    - name: "Navbar"
      purpose: "Smart responsive navigation. Floating rounded capsule when scrolled; shrinks logo. Contains desktop navigation links, mobile slide-down menu, and a 'Get a Quote' call-to-action button"
    - name: "Footer"
      purpose: "Detailed, dynamic site footer. Features large 'Ready to start?' CTA, social icons, multi-column directory, newsletter, contacts, and copyright details"
    - name: "WhatsAppButton"
      purpose: "Sticky floating action button in the bottom corner for direct client WhatsApp redirection"
    - name: "ScrollToTop"
      purpose: "Floating button that appears on scroll to quickly return to the top of the page"
    - name: "LeadCaptureModal"
      purpose: "Popup dialog box to collect client details, project details, and email addresses for lead gen"

footer_structure:
