technology_stack:
  core:
    framework: "React v18.3.1 (Vite + TypeScript)"
    routing: "React Router DOM v6.30.1"
    query_management: "TanStack React Query v5.83.0"
  styling:
    css_framework: "Tailwind CSS v3.4.17"
