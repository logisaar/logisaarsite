pages_directory:
  main_routes:
    - path: "/"
      component: "Index.tsx"
      title: "Home"
      description: "Company introduction. Features animated hero, tech stack marquee, stats, key services, testimonials, project carousel, choice points, and contact CTA."
    - path: "/about"
      component: "About.tsx"
      title: "About Us"
      description: "Company journey timeline, core values card gallery, and team members details."
    - path: "/services"
      component: "Services.tsx"
      title: "Our Services"
      description: "In-depth overview of Web Engineering, Mobile Solutions, AI & Automation, Growth Engineering, Experience Design, and Motion Design."
    - path: "/portfolio"
      component: "Portfolio.tsx"
      title: "Our Portfolio"
      description: "Filterable grid showcasing completed projects (Swosti Consultancy, Linchan's Taste, Baba Brand Fashion, Sako Sales, CMC Infratech, Digital Gatepass System, Nalanda Institute of Technology, Faculty Feedback System)."
    - path: "/pricing"
      component: "Pricing.tsx"
      title: "Pricing Plans"
      description: "Interactive cards showing price tiers (Basic, Growth, Enterprise, Custom CRM) starting at ₹2,999."
    - path: "/contact"
      component: "Contact.tsx"
      title: "Contact Us"
      description: "Interactive contact page containing a multi-step query capture form, email/phone contact methods, and location map details."
    - path: "/web-development-odisha"
      component: "Location.tsx"
      title: "Web Development in Odisha"
      description: "Dedicated landing page optimized for regional SEO, focusing on custom development in Bhubaneswar, Cuttack, and Odisha."
  
  services_subpages:
    - path: "/services/school-management-system"
      component: "SchoolManagement.tsx"
      title: "School Management System"
      description: "Feature set: Attendance, student portals, grade books, fees management, messaging."
    - path: "/services/hotel-management-system"
      component: "HotelManagement.tsx"
      title: "Hotel Management System"
      description: "Feature set: Room booking, check-in/out, POS integration, housekeeping updates, reporting."
    - path: "/services/ai-lead-followup"
      component: "AILeadFollowup.tsx"
      title: "AI Lead Followup"
      description: "Feature set: Automated response, sentiment analysis, multi-channel messaging, calendar sync."
    - path: "/services/ai-receptionist"
      component: "AIReceptionist.tsx"
      title: "AI Receptionist"
      description: "Feature set: 24/7 call answering, call routing, booking scheduling, query resolution, voice customizations."
    - path: "/services/proposal-software"
      component: "ProposalSoftware.tsx"
      title: "Proposal Software"
      description: "Feature set: Custom templates, digital signatures, tracking & analytics, client collaboration."
    - path: "/services/qr-menu-system"
      component: "QRMenu.tsx"
      title: "QR Menu System"
      description: "Feature set: Contactless scanning, digital checkout, custom branding, instant menu changes."
    - path: "/services/travel-website"
      component: "TravelWebsite.tsx"
      title: "Travel Website"
      description: "Feature set: Booking engine, itineraries builder, destination search, payment gateway, multi-currency support."
    - path: "/services/ai-automation"
      component: "AIAutomation.tsx"
      title: "AI & Workflow Automation"
      description: "Feature set: Business processes integration, AI custom models, chatbots, data analysis tools."
    - path: "/services/custom-crm"
      component: "CustomCRM.tsx"
      title: "Custom CRM Solutions"
      description: "Feature set: Customer pipelines, team workflows, automated email workflows, customizable dashboards."

  legal_routes:
    - path: "/privacy-policy"
      component: "PrivacyPolicy.tsx"
      title: "Privacy Policy"
    - path: "/terms-conditions"
      component: "TermsConditions.tsx"
      title: "Terms and Conditions"
    - path: "/terms-of-service"
      component: "TermsConditions.tsx"
      title: "Terms of Service"
    - path: "/cookie-policy"
      component: "CookiePolicy.tsx"
      title: "Cookie Policy"
    - path: "/refund-policy"
      component: "RefundPolicy.tsx"
      title: "Refund Policy"

  error_routes:
    - path: "*"
      component: "NotFound.tsx"
      title: "404 Page Not Found"

